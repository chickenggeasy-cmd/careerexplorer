<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- กำหนดสีชมพูไล่ระดับ (Gradient) -->
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" /> <!-- สีชมพูสว่าง -->
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" /> <!-- สีชมพูเข้ม (สีเดียวกับเว็บคุณ) -->
    </linearGradient>
  </defs>
  
  <!-- พื้นหลังสี่เหลี่ยมขอบมน -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#pinkGrad)"/>
  
  <!-- รูปเข็มทิศดวงดาวสีขาว (สื่อถึง Explorer) -->
  <path d="M256 110 L295 217 L402 256 L295 295 L256 402 L217 295 L110 256 L217 217 Z" fill="#ffffff"/>
  
  <!-- วงกลมตรงกลางเข็มทิศ -->
  <circle cx="256" cy="256" r="35" fill="#be185d"/>
</svg>
